# Inject database settings through environment variables in Compose/Kubernetes.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Avoid noisy SQL logs by default.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# The app listens on 8085; Kubernetes Service may expose port 8080.
server.port=${SERVER_PORT:8085}

management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
