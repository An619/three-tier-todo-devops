name: CodeQL

on:
  push:
    branches:
      - main
      - upgrade/production-ready-devops
  pull_request:
    branches:
      - main
      - upgrade/production-ready-devops
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze-java:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build with Maven
        run: mvn -B -f backend/pom.xml clean verify
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  analyze-frontend:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
