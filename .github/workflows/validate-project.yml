name: Validate project

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/production-ready-devops

permissions:
  contents: read

jobs:
  backend:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package backend
        run: mvn -B -f backend/pom.xml clean verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Killercoda values
        run: helm lint ./helm/taskmanager -f ./helm/taskmanager/values-killercoda.yaml
      - name: Lint Argo CD values
        run: helm lint ./helm/taskmanager -f ./helm/taskmanager/values-argocd.yaml

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/eks
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
      - name: Check formatting
        run: terraform fmt -diff -check -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
