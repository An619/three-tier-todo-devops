name: Validate project

on:
  pull_request:
  push:
    branches:
      - main
      - upgrade/production-ready-devops

permissions:
  contents: read

jobs:
  backend:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package backend
        run: mvn -B -f backend/pom.xml clean verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Killercoda values
        run: helm lint ./helm/taskmanager -f ./helm/taskmanager/values-killercoda.yaml
      - name: Lint Argo CD values
        run: helm lint ./helm/taskmanager -f ./helm/taskmanager/values-argocd.yaml
      - name: Lint microservices chart
        run: helm lint ./helm/microservices -f ./helm/microservices/values-argocd.yaml

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/eks
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
      - name: Check formatting
        run: terraform fmt -diff -check -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

  compose:
    name: Microservices Compose integration test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRONTEND_PORT: "3000"
      AUTH_DB_ROOT_PASSWORD: ci-auth-root-password
      AUTH_DB_PASSWORD: ci-auth-app-password
      TASK_DB_ROOT_PASSWORD: ci-task-root-password
      TASK_DB_PASSWORD: ci-task-app-password
      JWT_SECRET: ci-only-jwt-secret-key-with-more-than-32-bytes
      JWT_TTL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start microservices stack
        run: docker compose up -d --build
      - name: Wait for frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Frontend did not become ready"; exit 1
      - name: Verify registration and per-user task isolation
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/register.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"username":"ci-user-one","email":"ci-one@example.test","password":"TestPassword-123!"}' http://localhost:3000/api/auth/register)
          test "$status" = "201"
          token=$(jq -r .token /tmp/register.json)
          test -n "$token" && test "$token" != "null"
          unauth=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/tasks)
          test "$unauth" = "401"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"title":"CI-owned task","description":"ownership smoke test","priority":"high","status":"todo","category":"study"}' http://localhost:3000/api/tasks > /tmp/task.json
          task_id=$(jq -r .id /tmp/task.json)
          test -n "$task_id" && test "$task_id" != "null"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" http://localhost:3000/api/tasks | jq -e 'length == 1' >/dev/null
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"username":"ci-user-two","email":"ci-two@example.test","password":"OtherPassword-456!"}' http://localhost:3000/api/auth/register > /tmp/register-two.json
          token_two=$(jq -r .token /tmp/register-two.json)
          curl --fail --silent --show-error -H "Authorization: Bearer $token_two" http://localhost:3000/api/tasks | jq -e 'length == 0' >/dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token_two" "http://localhost:3000/api/tasks/$task_id")
          test "$status" = "404"
      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Always clean up
        if: always()
        run: docker compose down -v --remove-orphans
