apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
    - { name: http, port: {{ .Values.service.frontend.port }}, targetPort: {{ .Values.service.frontend.targetPort }} }
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  ports:
    - { name: http, port: {{ .Values.service.auth.port }}, targetPort: {{ .Values.service.auth.targetPort }} }
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth }
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  ports:
    - { name: http, port: {{ .Values.service.task.port }}, targetPort: {{ .Values.service.task.targetPort }} }
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: task }
