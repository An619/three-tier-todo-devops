apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: {{ .Values.replicaCount.auth }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: auth }
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.image.auth.repository }}:{{ .Values.image.auth.tag }}"
          imagePullPolicy: {{ .Values.image.auth.pullPolicy }}
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: SPRING_DATASOURCE_URL, value: {{ .Values.database.auth.url | quote }} }
            - { name: SPRING_DATASOURCE_USERNAME, value: {{ .Values.database.auth.username | quote }} }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: {{ .Values.secrets.authPasswordKey }} } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: {{ .Values.secrets.jwtSecretKey }} } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 45, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources.auth | nindent 12 }}
---
