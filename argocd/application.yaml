apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-todo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: three-tier-todo-devops
spec:
  project: default
  source:
    repoURL: https://github.com/An619/three-tier-todo-devops.git
    targetRevision: upgrade/production-ready-devops
    path: helm/taskmanager
    helm:
      valueFiles:
        - values-argocd.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskmanager
  # Manual sync is intentional until real, validated image tags replace the placeholders.
  # Enable automated sync after the first successful deployment and review.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
