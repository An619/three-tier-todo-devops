sonar.projectKey=three-tier-todo-devops
sonar.projectName=Three Tier Todo DevOps
sonar.sourceEncoding=UTF-8

# Analyse frontend and backend source; exclude generated/dependency content.
sonar.sources=frontend/src,backend/src/main
sonar.tests=backend/src/test
sonar.java.binaries=backend/target/classes
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/coverage/**

# Java tests are executed by Maven before the scanner runs.
sonar.test.inclusions=backend/src/test/**/*.java
